<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOMICMUSIC^ — CONTACT // ACQUISITIONS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="main-nav">
            <div class="nav-left">
                <a href="index.html?skip=true" class="brand-title" style="text-decoration: none; color: inherit;">LOOMICMUSIC^</a>
            </div>
        </nav>
        <main class="contact-page-wrapper">
            <header class="contact-header">
                <span class="label">B2B EXCLUSIVE TITLE TRANSFER // INQUIRIES</span>
                <h1 class="verse" style="margin-top: 10px; margin-bottom: 0;">SPECULATIVE LICENSE REQUEST</h1>
            </header>

            <form action="https://formsubmit.co" method="POST" class="contact-monolithic-form">
                <!-- Parametri di configurazione nascosti standard -->
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="NEW INQUIRY // LOOMICMUSIC^ SECURE VAULT REQUEST">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" value="https://github.io">

                <!-- 01. Nome Azienda / Brand (Mappato su name="name") -->
                <div class="form-field-group">
                    <label class="vault-meta">01 / COMPANY OR BRAND REPRESENTED</label>
                    <input type="text" name="name" placeholder="E.G. COUTURE HOUSE / PRODUCTION STUDIO" required autocomplete="off">
                </div>

                <!-- 02. Email Aziendale (Mappata su name="email") -->
                <div class="form-field-group">
                    <label class="vault-meta">02 / CORPORATE EMAIL ADDRESS</label>
                    <input type="email" name="email" placeholder="REPRESENTATIVE@COMPANY.COM" required autocomplete="off">
                </div>

                <!-- 03. Specifiche del Progetto (Mappato su name="message") -->
                <div class="form-field-group">
                    <label class="vault-meta">03 / PROPOSAL SPECIFICATIONS // VAULT KEY REQUEST</label>
                    <textarea name="message" placeholder="DESCRIBE THE SPECULATIVE FRAMEWORK, PROJECT DESTINATION AND SONIC PARAMETERS REQUIRED..." rows="6" required></textarea>
                </div>

                <button type="submit" class="form-submit-btn" style="padding: 16px; font-size: 10px; margin-top: 10px; width: 100%; cursor: pointer; background-color: #21201D; color: #FFFFFF; border: none; text-transform: uppercase; letter-spacing: 2px;">
                    SUBMIT ARCHIVAL ACCESS REQUEST
                </button>
            </form>
        </main>
    </div>
</body>
</html>
