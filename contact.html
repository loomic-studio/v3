<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOMICMUSIC^ — CONTACT // ACQUISITIONS</title>
    <link rel="stylesheet" href="style.css">
    <script>
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, false);

document.addEventListener('keydown', function(e) {
    if (e.metaKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
    }
    if (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'I' || e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
    }
}, false);
</script>
</head>
<body>
    <div class="container">
        <nav class="main-nav">
            <div class="nav-left">
                <a href="index.html?skip=true" class="brand-title" style="text-decoration: none; color: inherit;">LOOMICMUSIC^</a>
            </div>
        </nav>
        <main class="contact-page-wrapper">
            <header class="contact-header">
                <span class="label">B2B EXCLUSIVE TITLE TRANSFER // INQUIRIES</span>
                <h1 class="verse" style="margin-top: 10px; margin-bottom: 0;">SPECULATIVE LICENSE REQUEST</h1>
            </header>

            <!-- Protocollo mailto: nativo, indipendente e privo di blocchi server esterni -->
            <form action="mailto:loomic.music@gmail.com" method="GET" enctype="text/plain" class="contact-monolithic-form" autocomplete="off">
                
                <div class="form-field-group">
                    <label class="vault-meta">01 / COMPANY OR BRAND REPRESENTED</label>
                    <input type="text" name="COMPANY" placeholder="E.G. COUTURE HOUSE / PRODUCTION STUDIO" required autocomplete="off">
                </div>

                <div class="form-field-group">
                    <label class="vault-meta">02 / CORPORATE EMAIL ADDRESS</label>
                    <input type="email" name="EMAIL" placeholder="REPRESENTATIVE@COMPANY.COM" required autocomplete="off">
                </div>

                <div class="form-field-group">
                    <label class="vault-meta">03 / PROPOSAL SPECIFICATIONS // VAULT KEY REQUEST</label>
                    <textarea name="SPECIFICATIONS" placeholder="DESCRIBE THE SPECULATIVE FRAMEWORK AND SONIC PARAMETERS REQUIRED..." rows="6" required></textarea>
                </div>

                <button type="submit" class="form-submit-btn" style="padding: 16px; font-size: 10px; margin-top: 10px; width: 100%; cursor: pointer; background-color: #21201D; color: #FFFFFF; border: none; text-transform: uppercase; letter-spacing: 2px;">
                    SUBMIT ARCHIVAL ACCESS REQUEST
                </button>
            </form>
        </main>
    </div>
</body>
</html>
