<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOMICMUSIC^ — CONTACT // ACQUISITIONS</title>
    <link rel="stylesheet" href="style.css">
    <script>
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, false);

document.addEventListener('keydown', function(e) {
    if (e.metaKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
    }
    if (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'I' || e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
    }
}, false);
</script>
</head>
<body>
    <div class="container">
                       <!-- MENU SUPERIORE INTERNO - BLINDATO E ALLINEATO ALL'ARCHIVIO -->
        <nav class="main-nav sticky-nav" style="box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="nav-left">
                <a href="index.html?skip=true" class="brand-title" style="text-decoration: none; color: inherit; font-size: inherit; letter-spacing: inherit; font-family: inherit;">LOOMICMUSIC^</a>
            </div>
            <!-- Blocco destro con spaziatura ed estensione identica a Visual Archive -->
            <div class="nav-right" style="display: flex; align-items: center; justify-content: flex-end;">
                <a href="index.html" class="archive-back-link" style="text-decoration: none; color: inherit; font-size: 11px; letter-spacing: 0.15em; font-family: monospace; text-transform: uppercase; white-space: nowrap;">← CORE ARCHIVE</a>
            </div>
        </nav>

        
        <!-- SEZIONE CENTRALE MONUMENTALE ACQUISIZIONI B2B -->
        <main class="contact-page-wrapper">
            <header class="contact-header">
                <span class="label">B2B EXCLUSIVE TITLE TRANSFER // INQUIRIES</span>
                <h1 class="verse" style="margin-top: 10px; margin-bottom: 0;">SPECULATIVE LICENSE REQUEST</h1>
            </header>

            <!-- Modulo conforme alla sintassi ufficiale Forminit senza script aggiuntivi -->
            <form action="https://forminit.com/f/8x9zklqtc8t" method="POST" class="contact-monolithic-form" autocomplete="off">
                
                <!-- Parametro ufficiale per il reindirizzamento automatico dopo il successo -->
                <input type="hidden" name="_next" value="https://github.io">

                <!-- 01 / Azienda (Nome campo richiesto da Forminit) -->
                <div class="form-field-group">
                    <label class="vault-meta">01 / COMPANY OR BRAND REPRESENTED</label>
                    <input type="text" name="fi-sender-fullName" placeholder="E.G. COUTURE HOUSE / PRODUCTION STUDIO" required autocomplete="off">
                </div>

                <!-- 02 / Email Aziendale (Nome campo richiesto da Forminit) -->
                <div class="form-field-group">
                    <label class="vault-meta">02 / CORPORATE EMAIL ADDRESS</label>
                    <input type="email" name="fi-sender-email" placeholder="REPRESENTATIVE@COMPANY.COM" required autocomplete="off">
                </div>

                <!-- 03 / Specifiche del Progetto (Nome campo richiesto da Forminit) -->
                <div class="form-field-group">
                    <label class="vault-meta">03 / PROPOSAL SPECIFICATIONS // VAULT KEY REQUEST</label>
                    <textarea name="fi-text-your-message" placeholder="DESCRIBE THE SPECULATIVE FRAMEWORK, PROJECT DESTINATION AND SONIC PARAMETERS REQUIRED..." rows="6" required></textarea>
                </div>

                <button type="submit" class="form-submit-btn" style="padding: 16px; font-size: 10px; margin-top: 10px; width: 100%; cursor: pointer; background-color: #21201D; color: #FFFFFF; border: none; text-transform: uppercase; letter-spacing: 2px;">
                    SUBMIT ARCHIVAL ACCESS REQUEST
                </button>
            </form>
        </main>
    </div>
</body>
</html>
