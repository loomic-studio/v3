<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOMICMUSIC^ — CONTACT // ACQUISITIONS</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN ufficiale Forminit SDK da 2 KB -->
    <script src="https://forminit.com/sdk/v1/forminit.js"></script>
    <script>
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, false);

document.addEventListener('keydown', function(e) {
    if (e.metaKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
    }
    if (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'I' || e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
    }
}, false);
</script>
</head>
<body>
    <div class="container">
        <!-- MENU SUPERIORE INTERNO -->
        <nav class="main-nav">
            <div class="nav-left">
                <a href="index.html?skip=true" class="brand-title" style="text-decoration: none; color: inherit;">LOOMICMUSIC^</a>
            </div>
        </nav>
        
        <!-- SEZIONE CENTRALE MONUMENTALE ACQUISIZIONI B2B -->
        <main class="contact-page-wrapper">
            <header class="contact-header">
                <span class="label">B2B EXCLUSIVE TITLE TRANSFER // INQUIRIES</span>
                <h1 class="verse" style="margin-top: 10px; margin-bottom: 0;">SPECULATIVE LICENSE REQUEST</h1>
            </header>

            <!-- Modulo con ID agganciato al controllo JavaScript dell'SDK -->
            <form id="contact-form" class="contact-monolithic-form">
                
                <!-- 01 / Azienda (Mappato su attributo standard richiesto dal server) -->
                <div class="form-field-group">
                    <label class="vault-meta">01 / COMPANY OR BRAND REPRESENTED</label>
                    <input type="text" name="fi-sender-fullName" placeholder="E.G. COUTURE HOUSE / PRODUCTION STUDIO" required autocomplete="off">
                </div>

                <!-- 02 / Email Aziendale (Mappato su attributo standard richiesto dal server) -->
                <div class="form-field-group">
                    <label class="vault-meta">02 / CORPORATE EMAIL ADDRESS</label>
                    <input type="email" name="fi-sender-email" placeholder="REPRESENTATIVE@COMPANY.COM" required autocomplete="off">
                </div>

                <!-- 03 / Specifiche del Progetto (Mappato su attributo standard richiesto dal server) -->
                <div class="form-field-group">
                    <label class="vault-meta">03 / PROPOSAL SPECIFICATIONS // VAULT KEY REQUEST</label>
                    <textarea name="fi-text-message" placeholder="DESCRIBE THE SPECULATIVE FRAMEWORK, PROJECT DESTINATION AND SONIC PARAMETERS REQUIRED..." rows="6" required></textarea>
                </div>

                <button type="submit" class="form-submit-btn" style="padding: 16px; font-size: 10px; margin-top: 10px; width: 100%; cursor: pointer; background-color: #21201D; color: #FFFFFF; border: none; text-transform: uppercase; letter-spacing: 2px;">
                    SUBMIT ARCHIVAL ACCESS REQUEST
                </button>
            </form>
        </main>
    </div>

    <script>
        // Inizializzazione corretta dell'SDK secondo documentazione Forminit
        const forminit = new Forminit();
        const form = document.getElementById('contact-form');

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitBtn = form.querySelector('.form-submit-btn');
                if (submitBtn) submitBtn.disabled = true;

                const formData = new FormData(form);
                
                // Invia i dati tramite canale asincrono protetto con l'ID puro
                const { error } = await forminit.submit('8x9zklqtc8t', formData);

                if (!error) {
                    // Reindirizzamento pulito alla index in caso di successo
                    window.location.href = "https://github.io";
                } else {
                    alert("Submission error. Please verify network credentials.");
                    if (submitBtn) submitBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
